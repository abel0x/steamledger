<script>
  (function () {
    try {
      var theme = localStorage.getItem("steamledger.theme");
      if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
    } catch (e) { /* storage blocked: follow the system theme */ }
  })();
</script>

      </label>
      <label class="control">
        <span data-i18n="web.controls.theme">Theme</span>
        <select id="theme">
          <option value="auto" data-i18n="web.controls.theme_auto">System</option>
          <option value="light" data-i18n="web.controls.theme_light">Light</option>
